# Desenvolvimento: H2 em memoria (nada para instalar). Os dados somem ao reiniciar.
spring.datasource.url=jdbc:h2:mem:assistente;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Console do H2 desligado: ele nao funciona com a API protegida por login.
spring.h2.console.enabled=false

# Chave SOMENTE para desenvolvimento local. Nunca use esta em producao.
app.jwt.secret=${APP_JWT_SECRET:chave-apenas-para-desenvolvimento-local-0123456789}
