# Producao: PostgreSQL. Credenciais vem de variaveis de ambiente (nunca no codigo).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/assistente}
spring.datasource.username=${DB_USER:assistente}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.h2.console.enabled=false
