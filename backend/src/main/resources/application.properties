spring.application.name=backend

# Perfil padrao: desenvolvimento com H2 em memoria
spring.profiles.default=dev

management.endpoints.web.exposure.include=health,info

# Chave que assina os tokens de login (minimo 32 caracteres). Em producao: variavel APP_JWT_SECRET.
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiracao-horas=8
