<header class="topo">
  @if (auth.logado()) {
    <div class="menu">
      <button
        type="button"
        class="menu-botao"
        aria-haspopup="true"
        aria-controls="menu-painel"
        aria-label="Menu"
        [attr.aria-expanded]="menuAberto()"
        (click)="alternarMenu()"
      >
        <span class="hamburguer" aria-hidden="true"></span>
      </button>

      @if (menuAberto()) {
        <nav id="menu-painel" class="menu-painel" aria-label="Menu principal">
          <p class="saudacao">Olá, {{ saudacao() }}</p>
          <a routerLink="/visao-geral" routerLinkActive="ativo" (click)="fecharMenu()">Visão geral</a>
          <a routerLink="/perfil" routerLinkActive="ativo" (click)="fecharMenu()">Meus dados</a>
          <button type="button" class="menu-sair" (click)="sair()">Sair</button>
        </nav>
      }
    </div>
  }

  <strong class="marca">Assistente Diário</strong>
</header>

<main class="conteudo">
  <router-outlet />
</main>
