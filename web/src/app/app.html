<header class="topo">
  <strong>Assistente Diário</strong>
  @if (auth.logado()) {
    <nav>
      <a routerLink="/inicio" routerLinkActive="ativo">Início</a>
      <a routerLink="/perfil" routerLinkActive="ativo">Meus dados</a>
      <span class="usuario">{{ auth.email() }}</span>
      <button type="button" class="sair" (click)="auth.sair()">Sair</button>
    </nav>
  }
</header>

<main class="conteudo">
  <router-outlet />
</main>
