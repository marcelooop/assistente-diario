<section class="cartao estreito">
  <h1>Criar conta</h1>

  <form [formGroup]="form" (ngSubmit)="criar()" novalidate>
    <label>
      Nome de usuário
      <input type="text" formControlName="nomeUsuario" autocomplete="nickname" maxlength="30" />
      @if (form.controls.nomeUsuario.invalid && form.controls.nomeUsuario.touched) {
        <small class="erro">De 3 a 30 caracteres: letras, números, ponto, hífen ou sublinhado.</small>
      }
    </label>

    <label>
      E-mail
      <input type="email" formControlName="email" autocomplete="username" />
      @if (form.controls.email.invalid && form.controls.email.touched) {
        <small class="erro">Informe um e-mail válido.</small>
      }
    </label>

    <label>
      Senha (mínimo 8 caracteres)
      <input type="password" formControlName="senha" autocomplete="new-password" />
      @if (form.controls.senha.invalid && form.controls.senha.touched) {
        <small class="erro">A senha deve ter de 8 a 72 caracteres.</small>
      }
    </label>

    <label>
      Confirmar senha
      <input type="password" formControlName="confirmacao" autocomplete="new-password" />
      @if (form.hasError('senhasDiferentes') && form.controls.confirmacao.touched) {
        <small class="erro">As senhas não coincidem.</small>
      }
    </label>

    @if (erro()) { <p class="erro" role="alert">{{ erro() }}</p> }

    <button class="botao" type="submit" [disabled]="enviando()">
      {{ enviando() ? 'Criando…' : 'Criar conta' }}
    </button>
  </form>

  <p class="rodape">Já tem conta? <a routerLink="/login">Entrar</a></p>
</section>
