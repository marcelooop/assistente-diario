<section class="cartao">
  <h1>{{ id() === null ? 'Nova refeição' : 'Editar refeição' }}</h1>

  @if (carregando()) {
    <p>Carregando…</p>
  }

  <form [formGroup]="form" (ngSubmit)="salvar()" novalidate>
    <div class="linha">
      <label class="nome">
        Nome da refeição
        <input type="text" formControlName="nome" maxlength="120" placeholder="Ex.: Café da manhã" />
        @if (invalido(form.controls.nome)) { <small class="erro">Informe o nome da refeição.</small> }
      </label>

      <label>
        Horário
        <input type="time" formControlName="horario" />
        @if (invalido(form.controls.horario)) { <small class="erro">Informe o horário.</small> }
      </label>
    </div>

    <fieldset formArrayName="alimentos">
      <legend>Alimentos</legend>

      @for (alimento of alimentos.controls; track alimento; let i = $index) {
        <div class="alimento" [formGroupName]="i">
          <label>
            Alimento {{ i + 1 }}
            <input type="text" formControlName="nome" maxlength="120" placeholder="Ex.: Pão integral" />
            @if (invalido(alimento.controls.nome)) { <small class="erro">Informe o alimento.</small> }
          </label>

          <label class="calorias">
            Calorias (kcal)
            <input type="number" formControlName="calorias" min="0" step="any" inputmode="decimal" />
            @if (invalido(alimento.controls.calorias)) { <small class="erro">Informe as calorias.</small> }
          </label>

          <button
            type="button"
            class="botao secundario remover"
            [disabled]="alimentos.length === 1"
            [attr.aria-label]="'Remover alimento ' + (i + 1)"
            (click)="removerAlimento(i)"
          >
            Remover
          </button>
        </div>
      }

      <button type="button" class="botao secundario" (click)="adicionarAlimento()">+ Adicionar alimento</button>
    </fieldset>

    <div class="total" aria-live="polite">
      <span>Total da refeição</span>
      <strong>{{ total() | number: '1.0-2' }} kcal</strong>
    </div>

    @if (erro()) { <p class="erro" role="alert">{{ erro() }}</p> }

    <div class="acoes">
      <button class="botao" type="submit" [disabled]="salvando() || carregando()">
        {{ salvando() ? 'Salvando…' : 'Salvar' }}
      </button>
      <a class="botao secundario" routerLink="/refeicoes">Cancelar</a>
    </div>
  </form>
</section>
